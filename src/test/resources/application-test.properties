spring.application.name=RefirmApi-Test

# DATABASE CONFIGURATION (Neon PostgreSQL from .env)
spring.datasource.url=${NEONDB_URI:jdbc:postgresql://localhost:5432/testdb}
spring.datasource.username=${NEONDB_USER:neondb_owner}
spring.datasource.password=${NEONDB_PASS:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false

# OPENAI CONFIGURATION (from .env)
spring.ai.openai.chat.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.chat.api-key=${EMBEDDING_KEY:dummy-key-for-test}
spring.ai.openai.chat.options.model=gpt-6-luna

refirm.ai.models.extraction=gpt-6-luna
refirm.ai.models.conversation=gpt-6-luna
refirm.ai.models.reasoning=o3-mini

spring.ai.openai.embedding.base-url=${OPENAI_BASE_URL:https://api.openai.com}
spring.ai.openai.embedding.api-key=${EMBEDDING_KEY:dummy-key-for-test}
spring.ai.openai.embedding.options.model=text-embedding-3-small

spring.ai.openai.api-key=dummy-key-to-bypass-crash
spring.ai.openai.audio.speech.enabled=false
spring.ai.openai.audio.transcription.enabled=false
spring.ai.openai.image.enabled=false

spring.ai.vectorstore.pgvector.initialize-schema=false

clerk.issuer=https://full-mule-12.clerk.accounts.dev
clerk.jwks-url=https://full-mule-12.clerk.accounts.dev/.well-known/jwks.json
clerk.webhook.secret=${CLERK_WEBHOOK_SECRET:dummy-clerk-secret}

razorpay.api.key=${RAZORPAY_API_KEY:rzp_test_TJnAtswgk0kYRH}
razorpay.api.secret=${RAZORPAY_API_SECRET:dummy-razorpay-secret}

minio.endpoint=${MINIO_ENDPOINT:http://localhost:9000}
minio.access-key=${MINIO_ACCESS_KEY:cloudshare_admin}
minio.secret-key=${MINIO_SECRET_KEY:cloudshare_password}
minio.bucket-name=${MINIO_BUCKET_NAME:cloudshare-files}
